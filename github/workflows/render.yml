name: Render video promo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev \
            libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2

      - name: Pasang paket npm
        run: npm install

      - name: Render video
        run: |
          PROPS='{"voice":"","music":""}'
          if [ -f public/voice.mp3 ] && [ -f public/music.mp3 ]; then PROPS='{"voice":"voice.mp3","music":"music.mp3"}'
          elif [ -f public/voice.mp3 ]; then PROPS='{"voice":"voice.mp3","music":""}'
          elif [ -f public/music.mp3 ]; then PROPS='{"voice":"","music":"music.mp3"}'
          fi
          echo "props: $PROPS"
          npx remotion render src/index.ts SaturnXPromo out/saturn-x-promo.mp4 --props="$PROPS" --concurrency=2

      - uses: actions/upload-artifact@v4
        with:
          name: saturn-x-promo
          path: out/saturn-x-promo.mp4
          retention-days: 14
